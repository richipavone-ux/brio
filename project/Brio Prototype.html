<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brio · Prototype (Level 1)</title>
<style>
body{margin:0;background:#e6e8ee;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,sans-serif;color:#10151f;-webkit-font-smoothing:antialiased}
a{color:#2563eb}a:hover{color:#1d4ed8}
input{font:inherit;color:inherit;border:0;outline:0;background:transparent}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
*{box-sizing:border-box}
[data-act]{cursor:pointer}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.phone{width:390px;height:844px;border-radius:54px;border:10px solid #14161a;overflow:hidden;position:relative;display:flex;flex-direction:column;flex:none;box-shadow:0 24px 60px rgba(16,21,31,.22);background:#f6f7f9}
.island{position:absolute;top:11px;left:50%;margin-left:-61px;width:122px;height:36px;border-radius:20px;background:#000;z-index:30}
.status{height:54px;display:flex;justify-content:space-between;align-items:center;padding:0 32px 0 38px;font-weight:600;font-size:16px;flex:none}
.home{position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:#10151f;z-index:30}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.chip{display:flex;align-items:baseline;gap:4px;padding:6px 12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 1px #e9ebef;margin-bottom:4px}
.card{background:#fff;border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 28px -14px rgba(91,63,214,.4),inset 0 0 0 1.5px #ddd6fe}
.list{background:#eef0f3;border-radius:20px;border:1px solid #e9ebef;overflow:hidden;display:grid;gap:1px}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:12px 14px;background:#fff}
.row:hover{background:#fafbfc}
.tag{display:inline-flex;margin-top:6px;font-size:12px;font-weight:600;color:#5b3fd6;background:#f2f0ff;padding:4px 9px;border-radius:10px}
.btn{flex:1;height:46px;border-radius:23px;background:#eef0f5;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.btn.dark{background:#10151f;color:#fff}
.btn:active,.pill:active{transform:scale(.97)}
.dock{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:10px 20px 34px}
.pill{height:48px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1px #e4e7ec;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);background:#10151f;color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:20px;z-index:25;white-space:nowrap;animation:fadein .2s}
.backdrop{position:absolute;inset:0;background:rgba(16,21,31,.32);z-index:10;animation:fadein .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:770px;background:#fff;border-radius:34px 34px 0 0;padding:10px 18px 34px;z-index:11;display:flex;flex-direction:column;gap:14px;overflow-y:auto;animation:sheetin .25s ease-out}
.grab{width:38px;height:5px;border-radius:3px;background:#d0d5dd;margin:0 auto;flex:none}
.shead{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.shead span{color:#2563eb}
.form{background:#f5f6f8;border-radius:16px;display:grid;gap:1px;overflow:hidden;background-color:#e9ebef}
.form label{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 14px;font-size:16px;background:#f5f6f8}
.form input{text-align:right;color:#2563eb;font-weight:500;width:120px}
.box{background:#f5f6f8;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.box span{font-size:12px;color:#667085}.box input{font-size:24px;font-weight:700;width:100%}
.round{width:56px;height:56px;border-radius:50%;background:#f2f4f7;display:flex;align-items:center;justify-content:center;font-size:28px;color:#3a4150;flex:none}
.note{background:#f6f4ff;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;color:#3a4150}
.phrase{padding:12px 16px;border-radius:18px;background:#f6f4ff;font-size:15px;color:#3a2a9a}.phrase:hover{background:#ede9ff}
.serif{font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif;font-size:21px;line-height:1.3;text-align:center;letter-spacing:-.3px;text-wrap:balance}
.diff{background:#f6f4ff;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 0 1px #e6e3fb;display:grid;gap:1px;background-color:#e6e3fb}
.diff>div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 14px;background:#f6f4ff}
.orb{position:relative;flex:none}
.orb .body{position:absolute;inset:0;border-radius:50%;overflow:hidden;animation:orbbreath 4.5s ease-in-out infinite}
.orb .grad{position:absolute;inset:-25%;background:conic-gradient(from 0deg,#2563eb,#7c4dff,#e04ab0,#ff9f6b,#60a5fa,#2563eb);animation:orbspin 9s linear infinite}
.orb.listen .grad{animation-duration:2.6s}
.orb .shine{position:absolute;inset:0;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.7),rgba(255,255,255,.1) 34%,rgba(255,255,255,0) 55%),radial-gradient(circle at 72% 82%,rgba(255,255,255,.22),transparent 40%)}
.orb .eyes{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex}
.orb.listen .eyes{top:44%}
.orb .eyes b{display:block;border-radius:50%;background:#fff;animation:blink 5s infinite}
.orb.listen .eyes b{animation:none}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(124,77,255,.55);animation:ring 2.4s ease-out infinite}
.dots span{width:7px;height:7px;border-radius:50%;background:#7c4dff;animation:dots 1s infinite;display:inline-block}
@keyframes orbspin{to{transform:rotate(360deg)}}
@keyframes orbbreath{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
</style></head>
<body>
<div class="wrap"><div class="phone" id="phone" data-screen-label="Brio prototype"></div></div>
<script>
const ICR=10,ISF=40,TARGET=110,SPLIT_FAT=20,FIRST_PCT=.4;
const r2=x=>Math.round(x*2)/2;
const fmt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(Math.round(m)%60).padStart(2,'0');
const parseT=s=>{const [h,mm]=(s||'0:0').split(':').map(Number);return h*60+(mm||0)};
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S={now:822,nextId:6,sheet:null,draft:{},toast:'',v:null,
  logs:[
    {id:1,kind:'bg',m:470,bg:112,note:'Waking up'},
    {id:2,kind:'meal',m:485,name:'Yogurt and granola',carbs:38,fat:8,bg:112,taken:4},
    {id:3,kind:'bg',m:630,bg:104,note:''},
    {id:4,kind:'bg',m:778,bg:128,note:'Before lunch'},
    {id:5,kind:'meal',m:790,name:'Pizza margherita',carbs:92,fat:34,bg:128,taken:4,later:5.5,laterM:880}
  ]};

function plan(c,f,b){const cu=c/ICR,co=Math.max(0,(b-TARGET)/ISF),total=r2(cu+co),split=f>=SPLIT_FAT&&total>=2,now=split?r2(total*FIRST_PCT):total;return{cu,co,total,split,now,later:r2(total-now)}}
function recompute(l){if(l.kind!=='meal'||l.later==null)return l;const p=plan(l.carbs,l.fat,l.bg),rest=r2(p.total-l.taken);return rest>0?{...l,later:rest}:{...l,later:null,laterM:null}}
const lastBg=()=>S.logs.filter(l=>l.kind==='bg').sort((a,b)=>b.m-a.m)[0]||{bg:110,m:0};
const pending=()=>S.logs.filter(l=>l.kind==='meal'&&l.later).sort((a,b)=>a.laterM-b.laterM)[0];
const iob=()=>r2(S.logs.filter(l=>l.kind==='meal').reduce((a,l)=>a+l.taken*Math.max(0,1-(S.now-l.m)/240),0));

function orb(size,listen){const ew=size*.125,eh=size*.17,glow=Math.max(3,size*.09);
  return `<div class="orb${listen?' listen':''}" style="width:${size}px;height:${size}px;filter:drop-shadow(0 ${size*.12}px ${size*.22}px rgba(79,107,255,.38))">${listen?[0,1,2].map(i=>`<div class="ring" style="animation-delay:${i*.8}s"></div>`).join(''):''}<div class="body"><div class="grad"></div><div class="shine"></div></div><div class="eyes" style="gap:${size*.16}px"><b style="width:${ew}px;height:${eh}px;box-shadow:0 0 ${glow}px rgba(255,255,255,.9)"></b><b style="width:${ew}px;height:${eh}px;box-shadow:0 0 ${glow}px rgba(255,255,255,.9)"></b></div></div>`}

let toastT,voiceT;
function flash(t){S.toast=t;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast='';render()},2200)}

function today(){
  const lb=lastBg(),ago=S.now-lb.m,p=pending();
  const rows=[...S.logs].sort((a,b)=>b.m-a.m).map(l=>`<div class="row" data-act="edit" data-id="${l.id}"><span style="font-size:13px;color:#667085;font-variant-numeric:tabular-nums">${fmt(l.m)}</span><div style="min-width:0"><div style="font-size:15px;font-weight:600">${esc(l.kind==='meal'?l.name:'Glucose '+l.bg)}</div><div style="font-size:12px;color:#667085">${esc(l.kind==='meal'?`${l.carbs} g carbs · ${l.taken} U taken`:(l.note||'Fingerstick'))}</div>${l.kind==='meal'&&l.later?`<div class="tag">Next: ${l.later} U at ${fmt(l.laterM)}</div>`:''}</div><span style="color:#c0c6d0;font-size:20px">›</span></div>`).join('');
  let pend='';
  if(p){const mins=p.laterM-S.now,when=mins>0?'in '+(mins>=60?Math.floor(mins/60)+' h '+(mins%60)+' min':mins+' min'):'now';
    pend=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div style="font-size:12px;font-weight:600;color:#5b3fd6;letter-spacing:.02em">NEXT UP · ${esc(p.name.toUpperCase())}</div><div style="font-size:22px;font-weight:700;letter-spacing:-.4px;margin-top:2px">${p.later} U at ${fmt(p.laterM)}</div></div><div style="font-size:13px;font-weight:600;color:#5b3fd6;background:#f2f0ff;padding:5px 10px;border-radius:12px;white-space:nowrap">${when}</div></div><div style="display:flex;gap:8px"><div class="btn dark" style="flex:1.3" data-act="takePending">Took ${p.later} U</div><div class="btn" data-act="edit" data-id="${p.id}">Change</div></div></div>`}
  return `<div class="scroll">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px"><div><div style="font-size:13px;color:#667085;font-weight:500">Monday 12 October</div><div style="font-size:34px;font-weight:700;letter-spacing:-.8px;line-height:1.15">Today</div></div><div class="chip" data-act="newBg"><b style="font-size:16px">${lb.bg}</b><span style="font-size:12px;color:#667085">mg/dL</span></div></div>
  <div style="font-size:13px;color:#667085;padding:0 4px">${iob()} U insulin on board · last glucose ${ago<60?ago+' min':Math.floor(ago/60)+' h'} ago</div>
  ${pend}<div class="list">${rows}</div>
  <div style="font-size:12px;color:#98a2b3;text-align:center">You logged everything here. Tap any row to change it.</div></div>
  <div class="dock"><div class="pill" data-act="newMeal">+ Meal</div><div data-act="voice" style="display:flex;flex-direction:column;align-items:center;gap:4px">${orb(68)}<span style="font-size:11px;color:#8a92a3;font-weight:500">Tap to talk</span></div><div class="pill" data-act="newBg">+ Glucose</div></div>`}

const field=(label,k,type='number',extra='')=>`<label><span>${label}</span><input type="${type}" ${type==='number'?'inputmode="decimal"':''} data-k="${k}" value="${esc(S.draft[k])}" ${extra}></label>`;

function editPlanText(){const d=S.draft,c=num(d.carbs),f=num(d.fat),b=num(d.bg),pl=plan(c,f,b),t=recompute({...d,carbs:c,fat:f,bg:b,taken:num(d.taken)});
  return d.later==null?`Plan for this meal: ${pl.total} U in total. You logged ${num(d.taken)} U.`:(t.later?`After saving, the second dose becomes ${t.later} U at ${fmt(d.laterM)}.`:`After saving, no second dose is needed. I'll cancel the ${fmt(d.laterM)} reminder.`)}

function planHTML(){const d=S.draft,c=num(d.carbs),f=num(d.fat),b=num(d.bg)||lastBg().bg,p=plan(c,f,b);
  if(!(c>0))return `<div style="padding:30px 10px;text-align:center;font-size:14px;color:#98a2b3;line-height:1.5">Enter the carbs and I'll suggest a dose.<br>Fatty meal? I'll split it in two.</div>`;
  return `<div style="text-align:center;padding-top:4px"><div style="font-size:13px;color:#667085;font-weight:500">Suggested for this meal</div><div style="font-size:56px;font-weight:700;letter-spacing:-2px;line-height:1.05">${p.total}<span style="font-size:24px;letter-spacing:0;color:#667085;font-weight:500"> U</span></div></div>
  ${p.split?`<div style="display:flex;height:44px;border-radius:14px;overflow:hidden;gap:3px"><div style="flex:4;background:#5b3fd6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">${p.now} U now</div><div style="flex:6;background:#f2f0ff;color:#5b3fd6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">${p.later} U at ${fmt(S.now+90)}</div></div>`:''}
  <div style="font-size:13px;color:#667085;display:flex;flex-direction:column;gap:5px;background:#f8f9fb;border-radius:14px;padding:12px 14px">
  <div style="display:flex;justify-content:space-between"><span>${c} g ÷ carb ratio ${ICR}</span><b style="color:#10151f">${r2(p.cu)} U</b></div>
  <div style="display:flex;justify-content:space-between"><span>Correction ${b} → ${TARGET} (ISF ${ISF})</span><b style="color:#10151f">${r2(p.co)} U</b></div>
  <div style="display:flex;justify-content:space-between"><span>${p.split?`Fat ${f} g: ${FIRST_PCT*100}% now, rest in 1 h 30`:'One dose, now'}</span><b style="color:#10151f">${p.total} U</b></div></div>
  <div class="btn dark" style="flex:none;height:54px;border-radius:27px;font-size:16px" data-act="saveMeal">I took ${p.now} U</div>
  <div style="font-size:11px;color:#98a2b3;text-align:center;margin-top:-6px">Brio never logs a dose for you. Check every dose with your care plan.</div>`}

function bgComment(){const v=num(S.draft.bg);return v<70?"That's low. Take 15 g of fast sugar and check again in 15 minutes.":v>180?`That's above range. With ${iob()} U on board, I'd wait before correcting.`:'In range. Nice.'}

function sheet(){
  const t=S.sheet,d=S.draft;let h='';
  if(t==='editMeal')h=`<div class="shead"><span data-act="close">Cancel</span><b>Edit meal</b><span data-act="saveEdit" style="font-weight:600">Save</span></div>
   <div data-act="voice" style="display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:24px;background:#f2f0ff">${orb(38)}<div><div style="font-size:14px;font-weight:600">Or just tell me what changed</div><div style="font-size:12px;color:#667085">"I only ate half", "I took 5 units"</div></div></div>
   <input data-k="name" value="${esc(d.name)}" style="font-size:22px;font-weight:700;letter-spacing:-.3px;padding:0 4px">
   <div class="form">${field('Time','time','time')}${field('Carbs (g)','carbs')}${field('Fat (g)','fat')}${field('Glucose before','bg')}${field('Insulin taken (U)','taken','number','step="0.5"')}</div>
   <div class="note" id="live">${editPlanText()}</div>
   <div data-act="del" style="text-align:center;color:#dc2626;font-size:15px;padding:6px">Delete meal</div>`;
  if(t==='editBg'||t==='newBg')h=`<div class="shead"><span data-act="close">Cancel</span><b>${t==='newBg'?'Log glucose':'Edit glucose'}</b>${t==='editBg'?'<span data-act="saveEdit" style="font-weight:600">Save</span>':'<span style="width:50px"></span>'}</div>
   <div style="display:flex;align-items:center;justify-content:center;gap:28px;padding:28px 0 8px"><div class="round" data-act="dec">−</div><div style="text-align:center"><input type="number" inputmode="numeric" data-k="bg" value="${esc(d.bg)}" style="text-align:center;font-size:68px;font-weight:700;letter-spacing:-2.5px;width:160px"><div style="font-size:14px;color:#667085">mg/dL${t==='newBg'?' · now':''}</div></div><div class="round" data-act="inc">+</div></div>
   ${t==='editBg'?`<div class="form">${field('Time','time','time')}${field('Note','note','text','placeholder="Optional" style="width:180px"')}</div><div data-act="del" style="text-align:center;color:#dc2626;font-size:15px;padding:6px">Delete reading</div>`
   :`<div id="live" style="font-size:14px;color:#3a4150;text-align:center;line-height:1.45;padding:0 16px">${bgComment()}</div><div class="btn dark" style="flex:none;height:54px;border-radius:27px;font-size:16px;margin-top:10px" data-act="saveBg">Save</div>`}`;
  if(t==='newMeal')h=`<div class="shead"><span data-act="close">Cancel</span><b>New meal</b><span style="width:50px"></span></div>
   <input data-k="name" value="${esc(d.name)}" placeholder="What are you eating?" style="font-size:24px;font-weight:700;letter-spacing:-.4px;padding:0 4px">
   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
   <label class="box"><span>Carbs g</span><input type="number" inputmode="decimal" data-k="carbs" value="${esc(d.carbs)}" placeholder="0"></label>
   <label class="box"><span>Fat g</span><input type="number" inputmode="decimal" data-k="fat" value="${esc(d.fat)}" placeholder="0"></label>
   <label class="box"><span>Glucose</span><input type="number" inputmode="numeric" data-k="bg" value="${esc(d.bg)}"></label></div>
   <div id="live" style="display:flex;flex-direction:column;gap:14px">${planHTML()}</div>`;
  if(t==='voice'){const v=S.v;
   h=`<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px">${orb(84,v.stage!=='result')}
   ${v.stage==='listen'?'<div style="font-size:15px;color:#667085">Listening… or tap a phrase</div>':`<div class="serif">“${esc(v.said)}”</div>`}
   ${v.stage==='thinking'?'<div class="dots" style="display:flex;gap:5px"><span></span><span style="animation-delay:.2s"></span><span style="animation-delay:.4s"></span></div>':''}</div>`;
   if(v.stage==='listen')h+=`<div style="display:flex;flex-direction:column;gap:8px">${['It was only half a pizza','I took 5 units, not 4','Glucose is 140',"I'm eating pasta, 60 g"].map(p=>`<div class="phrase" data-act="say" data-text="${esc(p)}">${esc(p)}</div>`).join('')}</div>
   <div style="display:flex;align-items:center;gap:8px;background:#f5f6f8;border-radius:26px;padding:6px 6px 6px 16px"><input id="vt" placeholder="Or type it" style="flex:1;font-size:16px"><div data-act="send" style="width:38px;height:38px;border-radius:50%;background:#5b3fd6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">↑</div></div>`;
   if(v.stage==='result')h+=`<div style="font-size:14px;color:#3a4150;line-height:1.45;text-wrap:pretty">${esc(v.reply)}</div>
   ${v.changes.length?`<div class="diff">${v.changes.map(c=>`<div><span style="font-size:15px">${esc(c.label)}</span><span style="font-size:15px;font-weight:700;color:#5b3fd6;text-align:right">${esc(c.to)}</span><span></span><span style="font-size:12px;color:#98a2b3;text-decoration:line-through;text-align:right">${esc(c.from)}</span></div>`).join('')}</div>`:''}
   <div style="display:flex;gap:8px">${v.apply?`<div class="btn dark" style="flex:1.4" data-act="apply">${esc(v.applyLabel)}</div>`:''}<div class="btn" data-act="retry">Try again</div></div>`;
  }
  return `<div class="backdrop" data-act="close"></div><div class="sheet"><div class="grab"></div>${h}</div>`}

function render(){
  const ph=document.getElementById('phone');
  const st=ph.querySelector('.sheet')?.scrollTop||0;
  ph.innerHTML=`<div class="island"></div><div class="status"><span>${fmt(S.now)}</span><div style="display:flex;gap:6px;align-items:center"><div style="width:17px;height:10px;border-radius:2px;background:#10151f"></div><div style="width:25px;height:12px;border-radius:4px;border:1.5px solid #10151f;padding:1.5px"><div style="width:70%;height:100%;background:#10151f;border-radius:1.5px"></div></div></div></div>${today()}${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}${S.sheet?sheet():''}<div class="home"></div>`;
  const sh=ph.querySelector('.sheet');if(sh){sh.scrollTop=st;if(!S._anim)sh.style.animation='none'}
  const bd=ph.querySelector('.backdrop');if(bd&&!S._anim)bd.style.animation='none';
  S._anim=false;
}
function open(sheet,draft){S.sheet=sheet;S.draft=draft||{};S._anim=true;render()}
function close(){clearTimeout(voiceT);S.sheet=null;S.v=null;render()}

function parse(text){
  const t=text.toLowerCase(),meal=S.logs.filter(l=>l.kind==='meal').sort((a,b)=>b.m-a.m)[0];
  const half=/half|met[aà]|mezz/.test(t),took=t.match(/(?:took|taken|preso|fatto|fatte)\s*(\d+(?:[.,]\d)?)/),
        bg=t.match(/(?:glucose|glicemia|sugar|bg)\D{0,8}(\d{2,3})/),eat=t.match(/(?:eating|having|mangio|mangiando)\s+(?:a |an |some )?([a-zà-ù ]+?)(?:,|\s+\d|$)/);
  if((half||took)&&meal&&!eat){let n={...meal};const ch=[];
    if(half){n.carbs=Math.round(meal.carbs/2);n.fat=Math.round(meal.fat/2);ch.push({label:'Carbs',from:meal.carbs+' g',to:n.carbs+' g'})}
    if(took){n.taken=num(took[1]);ch.push({label:'Insulin taken',from:meal.taken+' U',to:n.taken+' U'})}
    const n2=recompute(n);
    if(meal.later!=null)ch.push({label:'Second dose',from:`${meal.later} U at ${fmt(meal.laterM)}`,to:n2.later?`${n2.later} U at ${fmt(n2.laterM)}`:'Not needed'});
    return{reply:meal.later!=null&&!n2.later?`Got it. What you took already covers the ${meal.name.toLowerCase()}, so I'll cancel the ${fmt(meal.laterM)} reminder.`:`Got it. Here's what I'd change on ${meal.name}:`,changes:ch,applyLabel:`Apply ${ch.length} change${ch.length>1?'s':''}`,
      apply:()=>{S.logs=S.logs.map(x=>x.id===meal.id?n2:x);S.sheet=null;S.v=null;flash('Updated '+meal.name)}}}
  if(bg){const val=+bg[1];return{reply:`I'll log glucose ${val} at ${fmt(S.now)}.`,changes:[{label:'New reading',from:'',to:val+' mg/dL'}],applyLabel:'Log it',
    apply:()=>{S.logs.push({id:S.nextId++,kind:'bg',m:S.now++,bg:val,note:'By voice'});S.sheet=null;S.v=null;flash('Glucose logged')}}}
  if(eat){const g=t.match(/(\d+)\s*g/),name=eat[1].trim().replace(/^\w/,c=>c.toUpperCase());
    return{reply:g?`${name}, about ${g[1]} g of carbs. Open it to check the numbers before dosing.`:`${name}. Tell me the carbs on the next screen and I'll do the math.`,changes:[],applyLabel:'Open new meal',
      apply:()=>open('newMeal',{name,carbs:g?g[1]:'',fat:'',bg:String(lastBg().bg)})}}
  return{reply:"I didn't catch a meal, a dose or a glucose value. Try one of the phrases, or use the buttons.",changes:[]}}
function say(text){if(!text||!text.trim())return;S.v={stage:'thinking',said:text};render();clearTimeout(voiceT);voiceT=setTimeout(()=>{S.v={stage:'result',said:text,...parse(text)};render()},900)}

const A={
  edit:el=>{const l=S.logs.find(x=>x.id==el.dataset.id);open(l.kind==='meal'?'editMeal':'editBg',{...l,time:fmt(l.m),carbs:String(l.carbs??''),fat:String(l.fat??''),bg:String(l.bg??''),taken:String(l.taken??''),note:l.note||''})},
  newMeal:()=>open('newMeal',{name:'',carbs:'',fat:'',bg:String(lastBg().bg)}),
  newBg:()=>open('newBg',{bg:String(lastBg().bg)}),
  voice:()=>{S.v={stage:'listen'};open('voice')},
  close,
  takePending:()=>{const p=pending();if(!p)return;const u=p.later;S.logs=S.logs.map(x=>x.id===p.id?{...x,taken:x.taken+x.later,later:null,laterM:null}:x);flash(u+' U logged')},
  saveEdit:()=>{const d=S.draft;let l={...d,m:parseT(d.time),bg:num(d.bg)};if(d.kind==='meal'){l={...l,carbs:num(d.carbs),fat:num(d.fat),taken:num(d.taken)};l=recompute(l)}delete l.time;S.logs=S.logs.map(x=>x.id===l.id?l:x);S.sheet=null;flash('Saved')},
  del:()=>{S.logs=S.logs.filter(x=>x.id!==S.draft.id);S.sheet=null;flash('Deleted')},
  saveMeal:()=>{const d=S.draft,c=num(d.carbs),f=num(d.fat),b=num(d.bg),p=plan(c,f,b),m=S.now;S.logs.push({id:S.nextId++,kind:'meal',m,name:d.name||'Meal',carbs:c,fat:f,bg:b,taken:p.now,later:p.split?p.later:null,laterM:p.split?m+90:null});S.now++;S.sheet=null;flash(p.split?`Logged. I'll remind you at ${fmt(m+90)}`:'Meal logged')},
  saveBg:()=>{S.logs.push({id:S.nextId++,kind:'bg',m:S.now++,bg:num(S.draft.bg),note:''});S.sheet=null;flash('Glucose logged')},
  inc:()=>{S.draft.bg=String(Math.max(20,num(S.draft.bg)+1));render()},
  dec:()=>{S.draft.bg=String(Math.max(20,num(S.draft.bg)-1));render()},
  say:el=>say(el.dataset.text),
  send:()=>say(document.getElementById('vt')?.value),
  apply:()=>S.v&&S.v.apply&&S.v.apply(),
  retry:()=>{S.v={stage:'listen'};render()}
};
const ph=document.getElementById('phone');
ph.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el)});
ph.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;S.draft[k]=e.target.value;const live=document.getElementById('live');if(!live)return;
  live.innerHTML=S.sheet==='newMeal'?planHTML():S.sheet==='editMeal'?editPlanText():bgComment()});
ph.addEventListener('keydown',e=>{if(e.target.id==='vt'&&e.key==='Enter')say(e.target.value)});
render();
</script>
</body></html>
