.thb::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 30% at 30% 70%,var(--tint),transparent 70%),radial-gradient(35% 28% at 75% 40%,color-mix(in srgb,var(--o2) 30%,transparent),transparent 70%),radial-gradient(30% 25% at 50% 90%,color-mix(in srgb,var(--o3) 25%,transparent),transparent 70%);animation:aur 6s ease-in-out infinite alternate}
.thc{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);border-radius:28px;padding:16px 16px 14px;transform:translateY(30px) scale(.96);opacity:0;transition:transform .6s cubic-bezier(.32,.72,0,1),opacity .35s}
#think.on .thc{transform:none;opacity:1}
.thr{display:flex;align-items:center;gap:14px}.thr img{width:40px;height:40px;border-radius:12px;object-fit:cover;flex:none;margin-left:-4px;box-shadow:0 0 0 2px var(--card)}
.tht{flex:1;min-width:0;line-height:1.3}.tht b{display:block;font-size:16px;font-weight:700;letter-spacing:-.2px;padding:1px 0}
.tht small{display:block;font-size:13px;color:var(--mut);margin-top:2px;animation:fin .45s both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thorb{position:relative;flex:none;width:44px;height:44px}
.thorb i{position:absolute;inset:0;background:conic-gradient(from 0deg,var(--pri),var(--o2),var(--o3),var(--pri));animation:spin 2.4s linear infinite,thgoo 2.2s ease-in-out infinite;border-radius:46% 54% 52% 48%/50% 46% 54% 50%}
.thorb i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 50%)}
.thorb b{position:absolute;left:50%;top:48%;width:16px;height:6px;margin:-3px 0 0 -8px;background:radial-gradient(circle at 3px 3px,#fff 2.6px,transparent 3px),radial-gradient(circle at 13px 3px,#fff 2.6px,transparent 3px);animation:thlook 2.4s ease-in-out infinite}
@keyframes thgoo{0%,100%{border-radius:46% 54% 52% 48%/50% 46% 54% 50%}33%{border-radius:56% 44% 46% 54%/44% 56% 46% 54%}66%{border-radius:48% 52% 58% 42%/54% 48% 52% 46%}}
@keyframes thlook{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px) translateY(-1px)}}
.thp{height:3px;border-radius:3px;background:var(--line);margin-top:14px;overflow:hidden}.thp i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--pri),var(--o2),var(--o3));animation:thbar 1.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes thbar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
.anl{display:none}
/* photo strip */
.pst{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.pth{position:relative;flex:none}.pth img{width:72px;height:72px;border-radius:16px;object-fit:cover;display:block}
.pth .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1;padding:0}
.padd{flex:none;width:72px;height:72px;border-radius:16px;border:1.5px dashed color-mix(in srgb,var(--pri) 45%,transparent);color:var(--pri);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;margin:0;background:var(--pl)}
.padd.lz::before{border-radius:16px;inset:0}
.rean{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:11px 14px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;text-align:left;cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.rean:active{transform:scale(.97)}.rean b{display:block;font-size:14px}.rean small{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.rean.hot{border-color:color-mix(in srgb,var(--pri) 50%,transparent);box-shadow:0 0 0 4px var(--tint)}
.rean .ro{flex:none;width:26px;height:26px;border-radius:46% 54% 52% 48%/50% 46% 54% 50%;background:conic-gradient(from 0deg,var(--pri),var(--o2),var(--o3),var(--pri));animation:thgoo 3s ease-in-out infinite}
.rech{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--pri);font-weight:600}
/* ---- v31: Brio thinking bubble, glass sheet, collapsible meal page ---- */
.thc{display:none}
.thw{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none}
.thbud{position:relative;width:76px;height:76px;transform:translateY(20px) scale(.6);opacity:0;transition:transform .7s cubic-bezier(.34,1.56,.64,1),opacity .3s;filter:drop-shadow(0 12px 26px var(--tint))}
#think.on .thbud{transform:none;opacity:1}
.thbud i{position:absolute;inset:0;background:conic-gradient(from 0deg,var(--pri),var(--o2),var(--o3),var(--pri));border-radius:46% 54% 52% 48%/50% 46% 54% 50%;animation:spin 3s linear infinite,thgoo 2.4s ease-in-out infinite}
.thbud i::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),rgba(255,255,255,0) 48%)}
.thbud b{position:absolute;left:50%;top:44%;width:26px;height:11px;margin:-5px 0 0 -13px;background:radial-gradient(ellipse 4px 5.5px at 5px 5.5px,#fff 90%,transparent),radial-gradient(ellipse 4px 5.5px at 21px 5.5px,#fff 90%,transparent);animation:thlook2 3s ease-in-out infinite}
@keyframes thlook2{0%,100%{transform:translate(-4px,-2px)}40%{transform:translate(4px,-3px)}70%{transform:translate(0,-1px)}}
.thbub{position:relative;max-width:78%;padding:12px 18px 12px;border-radius:24px;text-align:center;transform:translateY(16px) scale(.9);opacity:0;transition:transform .6s .08s cubic-bezier(.34,1.4,.64,1),opacity .3s .08s}
#think.on .thbub{transform:none;opacity:1}
.thbub::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:inherit;border-radius:3px}
.thbub small{display:block;font-size:11px;font-weight:600;color:var(--pri);letter-spacing:.02em;margin-bottom:2px}
.thbub #anlstep{display:inline;font-size:15px;font-weight:600;line-height:1.35;animation:fin .45s both}
.tdots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}.tdots b{width:5px;height:5px;border-radius:50%;background:var(--pri);opacity:.3;animation:tdot 1.2s ease-in-out infinite}.tdots b:nth-child(2){animation-delay:.15s}.tdots b:nth-child(3){animation-delay:.3s}
@keyframes tdot{30%{opacity:1;transform:translateY(-3px)}60%{opacity:.3;transform:none}}
.thph{display:flex;margin-bottom:-2px}.thph img{width:46px;height:46px;border-radius:14px;object-fit:cover;margin:0 -6px;box-shadow:0 0 0 2px var(--card),0 6px 16px rgba(0,0,0,.15);transform:rotate(calc((var(--k) - 1)*7deg));animation:fin .5s both}
/* glass sheet */
#sheet .shp{border-radius:30px;background-color:var(--gbg)!important;background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 50%)!important;-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 24px 60px rgba(15,23,42,.18)}
:root[data-theme="dark"] #sheet .shp{background-image:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 50%)!important;border-color:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.45)}
.shh{padding:2px 4px 0}.tin{border:0;background:transparent;padding:4px 0;font-size:22px;font-weight:700;letter-spacing:-.4px;color:var(--tx);border-radius:0;width:100%}.tin::placeholder{color:var(--tx);opacity:.9}.tin:focus::placeholder{opacity:.3}
#sheet .pin{background:color-mix(in srgb,var(--card) 55%,transparent);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
:root[data-theme="dark"] #sheet .pin{border-color:rgba(255,255,255,.08);box-shadow:none}
#sheet .cmp{background:color-mix(in srgb,var(--card) 60%,transparent);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
:root[data-theme="dark"] #sheet .cmp{border-color:rgba(255,255,255,.1);box-shadow:none}
#sheet .send{background:linear-gradient(135deg,var(--pri),var(--o2))}
/* collapsible sections */
.cx{margin-bottom:12px}.cx>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cx>summary::-webkit-details-marker{display:none}
.cx.card>summary{padding:2px 0}.cx>summary>span:first-child{flex:1;display:flex;align-items:center;gap:8px;font-size:15px}
.cx .smv{font-size:14px;font-weight:600;color:var(--mut)}
.chv{width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg) translate(-2px,-2px);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.cx[open]>summary .chv{transform:rotate(225deg) translate(-2px,-2px)}
.cx[open]>summary{margin-bottom:10px}
.cx[open]>*:not(summary){animation:rise .45s cubic-bezier(.32,.72,0,1) both}
.mh .cx{margin:12px 0 0}.mh .cx>summary span{font-size:13px;color:var(--pri);font-weight:600}
.live{font-style:normal;font-size:11px;font-weight:700;color:var(--ok);background:var(--okb);padding:2px 8px;border-radius:99px}
.cx.sx,.cx.card{padding:14px 16px}
.cxp{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:13px;color:var(--mut)}
/* IOB in logs */
.qn2{display:flex;gap:8px;margin-top:8px}.qn2 .qn{margin:0;flex:1}
.iobi{display:flex;align-items:center;gap:4px;margin:0;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:600;color:var(--mut);flex:none}
.iobi input{width:42px;border:0;background:transparent;padding:10px 0;text-align:right;font-size:15px;font-weight:600;color:var(--tx);border-radius:0}
.ibc{grid-column:2/-1;justify-self:start;font-size:11px;font-weight:700;color:var(--pri);background:var(--pl);padding:2px 8px;border-radius:99px;margin-top:2px}
.ni{display:grid;grid-template-columns:1fr 84px;gap:8px}
/* ---- v32 ---- */
.thbub.done{pointer-events:auto;text-align:left;max-width:86%;padding:14px 16px}
.thbub.done p{margin:4px 0 0;font-size:15px;line-height:1.4;font-weight:500}
.thbub.done .wt{display:flex;gap:6px;align-items:flex-start;font-size:14px;color:var(--mut);font-weight:500}.thbub.done .wt svg{flex:none;margin-top:3px;color:var(--pri)}
.gotit{display:block;margin:12px 0 0 auto;border:0;border-radius:99px;padding:8px 18px;font:inherit;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--o2));cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}.gotit:active{transform:scale(.92)}
#think .thb{cursor:pointer}
/* ---- v33: extra checks ---- */
.ckr2 .ck{font:inherit;font-size:11px;font-weight:700;line-height:1.4;cursor:default}
.ck.xc{border-style:dashed;border-color:color-mix(in srgb,var(--pri) 55%,transparent);color:var(--pri);background:transparent;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.ck.xc.ok{border-style:solid}.ck.xc i{font-style:normal;font-size:13px;opacity:.6}
.ck.add{border:0;background:var(--pl);color:var(--pri);cursor:pointer;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}.ck.add:active{transform:scale(.92)}.ck.add.on{background:var(--pri);color:#fff}
.xcp{margin-top:10px;padding:12px;border-radius:18px;background:var(--bg);animation:rise .45s cubic-bezier(.32,.72,0,1) both}
.xcp p{margin:0 0 10px;font-size:12px;color:var(--mut)}
.xcg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.xo{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 2px;font:inherit;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.xo b{font-size:14px}.xo small{font-size:10px;color:var(--mut)}.xo:active{transform:scale(.92)}.xo.past{opacity:.35}
.dt.xc{border-style:dashed}
/* ---- v34: actionable tips ---- */
#obtip.act{pointer-events:auto;cursor:pointer}#obtip i{font-style:normal;font-weight:800;color:var(--pri);margin-left:6px}
/* ---- v36: sleep & vanish ---- */
#plus .orb3{transition:clip-path .62s cubic-bezier(.4,1.35,.5,1),transform .9s cubic-bezier(.32,.72,0,1),opacity .6s,filter .6s}
#plus.sleep .ob-eyes b{height:2.5px;border-radius:2px;transform:translateY(2px)}
#plus.sleep .ob-eyes{transform:translate(-50%,-50%) translate(0,calc(var(--eyy,0px) + 2px))}
#plus.sleep span.orb3{animation:snooze 4s ease-in-out infinite;filter:saturate(.75) brightness(.95)}
@keyframes snooze{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97) translateY(1px)}}
#plus::before{content:"z";position:absolute;left:58%;top:6px;font-size:13px;font-weight:800;color:var(--pri);opacity:0;pointer-events:none}
#plus.sleep::before{animation:zz 3.2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,6px) scale(.6)}30%{opacity:.8}100%{opacity:0;transform:translate(14px,-18px) scale(1.15)}}
#plus.gone span.orb3{transform:scale(.15) translateY(30px);opacity:0;filter:blur(6px)}
#plus.gone .ob-eyes{opacity:0;transition:opacity .3s}
#plus.gone::after{opacity:0;transition:opacity .6s}
#plus.gone::before{display:none}
#plus.back span.orb3{animation:backin .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes backin{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.12,.9);opacity:1}100%{transform:none}}
/* ---- v37: closed eyes only, slow vanish, bigger return ---- */
#plus.sleep::before{animation:none;display:none}
#plus.sleep span.orb3{animation:none;filter:none}
#plus span.orb3{transition:clip-path .62s cubic-bezier(.4,1.35,.5,1),transform 2.6s cubic-bezier(.45,0,.2,1),opacity 2.4s cubic-bezier(.45,0,.2,1),filter 2.4s ease}
#plus.gone span.orb3{transform:scale(.05) translateY(12px);opacity:0;filter:blur(10px) saturate(1.4)}
#plus .ob-eyes{transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity 1s ease}
#plus.gone .ob-eyes{opacity:0;transition:opacity .9s ease}
#plus::after{transition:opacity 2.4s ease,transform 2.4s ease}
#plus.gone::after{opacity:0;transform:scale(.3)}
#plus.back span.orb3{transition:none;animation:backin2 1.1s cubic-bezier(.22,1,.36,1) both}
#plus.back .ob-eyes{animation:eyesin 1.1s both}
#plus.back::after{transition:none;animation:shin 1.1s ease both}
@keyframes backin2{0%{transform:scale(0) rotate(-40deg);opacity:0;filter:blur(8px) brightness(1.6)}35%{transform:scale(1.32,1.18) rotate(8deg);opacity:1;filter:blur(0) brightness(1.4)}55%{transform:scale(.86,1.12) rotate(-4deg);filter:brightness(1.15)}72%{transform:scale(1.08,.94)}86%{transform:scale(.97,1.03)}100%{transform:none;filter:none}}
@keyframes eyesin{0%,40%{opacity:0;transform:translate(-50%,-50%) scale(.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:1}}
@keyframes shin{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.6)}100%{opacity:1;transform:none}}
#plus .ring2{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;pointer-events:none;border:2px solid var(--pri);opacity:0}
#plus.back .ring2{animation:ring2 .9s cubic-bezier(.22,1,.36,1) .15s}
@keyframes ring2{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(2.1)}}
/* ---- v38: orb states apply to every orb; ghost-like retreat ---- */
#plus.sleep .ob-eyes b{height:2.5px!important;width:8px!important;border-radius:2px!important;border:0!important;background:#fff!important}
#plus.blink:not(.sleep) .ob-eyes b{transform:scaleY(.12)!important}
#plus.giggle .ob-eyes b{height:6px!important;width:10px!important;background:transparent!important;box-shadow:none!important;border:2.5px solid #fff!important;border-bottom:0!important;border-radius:8px 8px 0 0!important}
#plus.gone span.orb3,:root[data-egg] #plus.gone span.orb3{transform:none!important;opacity:1!important;filter:none!important}
#plus.gone .ob-eyes{opacity:1!important}
#plus.gone::after{opacity:1!important;transform:none!important}
#plus.gone{animation:ghost 3.8s cubic-bezier(.42,0,.38,1) forwards!important}
@keyframes ghost{
  0%{transform:none;opacity:1;filter:none}
  20%{transform:translate(-2px,-3px) scale(.96);opacity:.92;filter:blur(.3px)}
  45%{transform:translate(2px,-9px) scale(.84);opacity:.66;filter:blur(1.4px) saturate(.85)}
  70%{transform:translate(-1px,-16px) scale(.68);opacity:.32;filter:blur(3.5px) saturate(.7)}
  100%{transform:translate(0,-24px) scale(.5);opacity:0;filter:blur(7px) saturate(.6)}}
/* ---- v39: simple fade while asleep ---- */
#plus.gone{animation:ghost2 3.2s cubic-bezier(.4,0,.2,1) forwards!important}
@keyframes ghost2{0%{transform:none;opacity:1;filter:none}100%{transform:scale(.5);opacity:0;filter:blur(6px) saturate(.5)}}
/* ---- v40b: sleep = flat eyes + floating z (every orb, consistent lines) ---- */
#plus.sleep .ob-eyes b{height:2.5px!important;width:9px!important;border-radius:2px!important;border:0!important;background:#fff!important;box-shadow:0 0 4px rgba(255,255,255,.6)!important;transform:translateY(2px)!important}
#plus.sleep span.orb3{animation:snooze 4s ease-in-out infinite!important}
#plus::before{content:"z";position:absolute;left:62%;top:4px;font-size:13px;font-weight:800;line-height:1;color:var(--pri);opacity:0;pointer-events:none;z-index:4}
#plus.sleep:not(.gone)::before{display:block!important;animation:zz 3.2s ease-in-out infinite!important}
@keyframes ghost2{0%{transform:none;opacity:1;filter:none}100%{transform:scale(.5);opacity:0;filter:blur(6px) saturate(.5)}}
/* ---- v41: icon filter, scheduled doses, multi-photo, rename ---- */
.ff{display:flex;align-items:center;justify-content:space-between;margin:18px 6px 0}
.ffl{font-size:13px;font-weight:600;color:var(--mut)}
.fseg{padding:3px!important;border-radius:99px!important;gap:2px;background-color:var(--gbg)!important;-webkit-backdrop-filter:blur(var(--gb)) saturate(180%);backdrop-filter:blur(var(--gb)) saturate(180%);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px rgba(15,23,42,.06)}
:root[data-theme="dark"] .fseg{border-color:rgba(255,255,255,.1);box-shadow:none}

.lsch span{font-variant-numeric:tabular-nums}.lsch em{font-style:normal;font-weight:700;color:var(--pri)}.lsch small{font-size:11px;flex:1}

.nphs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;align-items:flex-start}.nphs .phs{margin:0}.nphs .phs img{width:58px;height:58px}

.mh .ttl[contenteditable]{outline:0;border-radius:8px;cursor:text;transition:background .25s,box-shadow .25s}

.lsch small{color:var(--mut)!important}
/* ---- v42 ---- */
.ff{justify-content:flex-end}
.cx:not([open])>*:not(summary){display:none!important}

.tg2{display:block;font-size:11px;color:var(--mut);font-weight:500;margin-top:1px}

.ior{display:inline-flex;align-items:baseline;gap:4px;font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}.ior b{font-size:15px;font-weight:700;color:var(--tx)}
.irow .ior{flex:none}.ovh .ior{flex:none;margin-top:2px}

  else if(o==='skip'){if(OB.i<1&&!S.cfg.icr&&!OB.replay){OB.i=1;haptic();obDraw()}else obFinish()}
  else if(o==='up'||o==='dn'){const k=b.dataset.k,st=+b.dataset.s,cur=OB.v[k],nv=o==='up'?Math.min(+b.dataset.mx,cur+st):Math.max(+b.dataset.mn,cur-st);if(nv!==cur){OB.v[k]=Math.round(nv*10)/10;const nv2=OB.v[k];haptic();const out=document.getElementById('ob_'+k);out.value=nv2;out.animate([{transform:'scale(1.18)'},{transform:'none'}],{duration:220,easing:'cubic-bezier(.3,1.4,.4,1)'})}}
  else if(o==='stp'){OB.v.step=+b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));haptic()}
  else if(o==='nums'){document.querySelectorAll('#onb .obst input').forEach(obVal);Object.assign(S.cfg,{icr:OB.v.icr,isf:OB.v.isf,target:OB.v.target,step:OB.v.step});save();obNext()}
  else if(o==='meal')obFinish('meal');
  else if(o==='done')obFinish();
});
addEventListener('resize',()=>{if(OB)obHole()});
document.getElementById('onb').addEventListener('change',e=>{if(e.target.matches('.obst input'))obVal(e.target)});
document.getElementById('onb').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.obst input')){obVal(e.target);e.target.blur()}});
document.getElementById('onb').addEventListener('focusin',e=>{if(e.target.matches('.obst input'))setTimeout(()=>{try{e.target.select()}catch(x){}},30)});
// ---- First-time tips: the first time you meet a page or a tool, Brio points at what matters, one thing at a time ----
let CO=null;const CQ=[];
const $a=s=>document.querySelector('#stage .page.act '+s);
const secCard=t=>{const s=[...document.querySelectorAll('#stage .page.act .sec3')].find(x=>x.textContent.trim().startsWith(t));return s&&s.nextElementSibling};
const paneAct=()=>{const p=document.querySelectorAll('#stage .page.act .mpane');return p[MSEGS.indexOf(MSEG)]||null};
const inPane=s=>{const p=paneAct();return p&&p.querySelector(s)};
const TOURS={
  home_live:[
    {q:()=>$a('#live .lvc'),t:'Live now',b:'A meal in progress stays here until its last check. Tap it to see the next step and log it right here.'},
    {q:()=>$a('#iobh'),t:'Insulin on board',b:'What is still working from the doses you logged. I take it off every new plan.'},
    {q:()=>plus,t:'When I glow yellow',b:'A dose or a check is due. Tap me and I take you straight to it.'}],
  sheet:[
    {q:()=>document.querySelector('#sheet .nmf:not(.nmf2)'),t:'Glucose now',b:'Your reading right now. If you logged one in the last 20 minutes, it is already filled in.'},
    {q:()=>document.querySelector('#sheet .nmf2'),t:'Insulin on board',b:'Insulin still active from earlier doses. Type yours, or tap my suggestion when I have one.'},
    {q:()=>document.querySelector('#sheet .cmp'),t:'Your meal',b:'Describe it in a few words, add a photo with the camera, or both. Both gives the best estimate.'},
    {q:()=>document.querySelector('#sheet .send'),t:'Send it to me',b:'I estimate carbs, protein and fat, then build a plan with your numbers. Doses are logged only when you log them.'}],
  res_live:[
    {q:()=>$a('.mh3'),t:'Your meal',b:'What I estimated from your words and photo. Something off? Add a photo or tap re-check.'},
    {q:()=>$a('.msr'),t:'Your mission',b:'Doses and checks, in order. Tap a step when you do it to log it. I never log for you.'},
    {q:()=>$a('.dplan'),t:'Took it as planned?',b:'One tap logs the planned doses with their times.'},
    {q:()=>$a('[data-a="xct"]'),t:'Extra check',b:'Want one more fingerstick? Add a check at a later time. Changed your mind? Remove it with the ×.'},
    {q:()=>secCard('Curve'),t:'The curve',b:'My forecast for the next hours. Your real readings land on top, so you see how close it was.'},
    {q:()=>$a('.lr3')||$a('#logsec'),t:'Logs',b:'Everything you logged for this meal. Tap a row to edit it.'},
    {q:()=>$a('.bk'),t:'Back home',b:'Tap here when you are done. The meal keeps going in Live now.'}],
  res_past:[
    {q:()=>$a('.mh3'),t:'A past meal',b:'What you ate, when, and where you started from.'},
    {q:()=>$a('.msr'),t:'How the plan went',b:'A check mark is done, red is missed. Forgot to log something? Tap the step and log it late.'},
    {q:()=>secCard('Curve'),t:'Forecast vs reality',b:'At the top: how much of your real readings matched my forecast, the real peak and the time in range.'},
    {q:()=>$a('.mem3')&&$a('.mem3').closest('.card'),t:'What I remember',b:'How meals like this went before. I use it to plan the next one better.'},
    {q:()=>$a('.lr3'),t:'Fix a log',b:'Tap any row to change the time or value, or to delete it.'},
    {q:()=>$a('[data-a="fav"]'),t:'Favorite',b:'Star the meals you eat often. You find them in a tap in Memory.'}],
  hist:[
    {q:()=>$a('.mseg'),t:'Your Memory',b:'Meals, Foods and Playbook. Tap one, or swipe the page left and right.'},
    {q:()=>$a('#mq'),t:'Search',b:'Find any past meal by name.'},
    {q:()=>$a('.favt'),t:'Favorites',b:'Show only the meals you starred.'},
    {q:()=>inPane('.mcard'),t:'A past meal',b:'Tap to open it. Tap the star to keep it in favorites.'},
    {q:()=>$a('.bk'),t:'Back home',b:'Tap here, or pull the page down.'}],
  foods:[
    {q:()=>inPane('.fd3.pend'),t:'To confirm',b:'Foods I learned from your meals. ✓ keeps them, × throws them away.'},
    {q:()=>inPane('.fd3.add'),t:'Add a food',b:'Type it, scan the label or the barcode. Values are always per 100 g.'},
    {q:()=>inPane('.fd3:not(.add):not(.pend)'),t:'Your foods',b:'I use them to estimate meals better. Tap one to edit it. The star means I added it.'}],
  play:[
    {q:()=>inPane('.card'),t:'Your numbers',b:'Time in range and averages, from your readings.'},
    {q:()=>{const p=paneAct();return p&&p.querySelectorAll('.card')[1]},t:'Your rhythm',b:'When in the day you run higher or lower. Good to bring to your next visit.'},
    {q:()=>inPane('.pbk3'),t:'Meals you repeat',b:'How they usually go. Tap one to open its last time.'}],
  set:[
    {q:()=>{const h=[...document.querySelectorAll('#stage .page.act h3.dh')].find(x=>/Appearance/.test(x.textContent));return h&&h.nextElementSibling},t:'Make it yours',b:'Theme, accent color and more options for glass, corners and text size.'},
    {q:()=>{const h=[...document.querySelectorAll('#stage .page.act h3.dh')].find(x=>/Insulin/.test(x.textContent));return h&&h.nextElementSibling},t:'Your insulin numbers',b:'The base of every plan. Tap the i next to each one to see what it means. Change them together with your diabetes team.'},
    {q:()=>$a('[data-a="obreplay"]'),t:'Meet Brio again',b:'Replays the intro and every tip, whenever you want.'},
    {q:()=>{const h=[...document.querySelectorAll('#stage .page.act h3.dh')].find(x=>/General/.test(x.textContent));return h&&h.nextElementSibling},t:'General',b:'Turn on Ask Brio to talk with me. Haptics and page effects live here too.'}],
  rep:[
    {q:()=>$a('.rbtn'),t:'New report',b:'Attach your weekly CGM report, as a PDF or screenshots. I read it for you.'},
    {q:()=>{const r=$a('.rdet');return r&&r.parentElement},t:'Your week at a glance',b:'How many goals you met and how each one moved since last week. Until you attach yours, this is example data.'},
    {q:()=>$a('.rdet'),t:'Patterns and summary',b:'The details: patterns, what improved, what to watch.'}],
  qa:[
    {q:()=>$a('#isl'),t:'Log glucose',b:'Type the value and tap Add. During a meal it goes into that meal’s logs, so it counts for its checks.'}]
};
function coachKnown(){return S.meals.length||(S.gl||[]).length||Object.keys(S.foods||{}).length||S.cfg.icr!=null}
// people who already used the app skip the intro and the tips (they can replay them from Settings)
function firstRun(){if(S.cfg.onb==null&&coachKnown()&&!OB)S.cfg.onb=1;if(!S.cfg.seen){S.cfg.seen={};if(S.cfg.onb)Object.keys(TOURS).forEach(k=>S.cfg.seen[k]=1)}}
firstRun();
function coachVis(el){if(!el||!el.isConnected)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0}
function coach(key,force){if(!TOURS[key])return;S.cfg.seen=S.cfg.seen||{};if(S.cfg.seen[key]&&!force)return;if(OB||CO){if(!CQ.includes(key))CQ.push(key);return}
  if(!TOURS[key].some(s=>coachVis(s.q())))return;
  CO={key,i:-1,n:TOURS[key].filter(s=>coachVis(s.q())).length,k:0};try{hush()}catch(e){}try{budHide()}catch(e){}
  const a=document.activeElement;if(a&&a.blur&&a!==document.body)a.blur();
  const el=document.getElementById('coach');el.innerHTML='<div class="cospot"></div><div class="cobub"></div>';el.hidden=false;requestAnimationFrame(()=>el.classList.add('on'));coNext()}
function coScroller(el){let p=el.parentElement;while(p&&p!==document.body){const s=getComputedStyle(p);if(/(auto|scroll)/.test(s.overflowY)&&p.scrollHeight>p.clientHeight+2)return p;p=p.parentElement}return null}
function coNext(){if(!CO)return;const T=TOURS[CO.key];let s=null,el=null;
  while(++CO.i<T.length){el=T[CO.i].q();if(coachVis(el)){s=T[CO.i];break}}
  if(!s)return coEnd();CO.k++;CO.el=el;const H=innerHeight;let r=el.getBoundingClientRect();const sc=coScroller(el);
  if(sc&&(r.top<90||r.bottom>H-230)){const want=Math.max(0,Math.min(r.height,H*.4));sc.scrollBy({top:r.top-(H*.42-want/2),behavior:'smooth'});setTimeout(()=>coPlace(s,el),420)}else coPlace(s,el)}
function coPlace(s,el){if(!CO)return;const box=document.getElementById('coach'),sp=box.querySelector('.cospot'),bb=box.querySelector('.cobub'),H=innerHeight,W=innerWidth,r=el.getBoundingClientRect(),pd=el===plus?10:6;
  const top=Math.max(8,r.top-pd),bot=Math.min(H-8,r.bottom+pd),h=Math.max(24,bot-top),rad=el===plus?h/2:Math.min(24,h/2);
  Object.assign(sp.style,{left:(r.left-pd)+'px',top:top+'px',width:(r.width+pd*2)+'px',height:h+'px',borderRadius:rad+'px'});
  const last=CO.k>=CO.n;
  bb.innerHTML=`<div class="coin"><div class="coh"><span class="coorb"><i></i><i></i></span><b>${esc(s.t)}</b></div><p>${esc(s.b)}</p><div class="cof">${CO.n>1?`<span class="codots">${Array.from({length:CO.n},(_,k)=>`<i class="${k===CO.k-1?'on':''}"></i>`).join('')}</span>`:'<span></span>'}<span>${!last?'<button class="coskip" data-c="skip">Skip</button>':''}<button class="cogo" data-c="next">${last?'Got it':'Next'}</button></span></div></div>`;
  const bh=bb.offsetHeight,below=H-bot,above=top;let y;
  if(below>=bh+22)y=bot+12;else if(above>=bh+22)y=top-12-bh;else y=H-bh-16-(parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0);
  bb.style.top=Math.max(12,y)+'px';bb.classList.toggle('up',y<top);
  const ax=Math.max(28,Math.min(bb.offsetWidth-28,r.left+r.width/2-bb.offsetLeft));bb.style.setProperty('--ax',ax+'px');
  haptic()}
function coEnd(skip){if(!CO)return;const key=CO.key,box=document.getElementById('coach');S.cfg.seen[key]=1;save();CO=null;box.classList.remove('on');setTimeout(()=>{if(!CO){box.hidden=true;box.innerHTML=''}},380);
  const nx=CQ.shift();if(nx)setTimeout(()=>coach(nx),500);else if(key==='home_live'||view==='log')budSched(15000)}
document.getElementById('coach').addEventListener('click',e=>{e.stopPropagation();e.preventDefault();if(!CO)return;const b=e.target.closest('[data-c]');if(b&&b.dataset.c==='skip'){coEnd(1);return}coNext()});
['pointerdown','touchstart'].forEach(ev=>document.getElementById('coach').addEventListener(ev,e=>e.stopPropagation(),{passive:true}));
addEventListener('resize',()=>{if(CO&&CO.el&&TOURS[CO.key][CO.i])coPlace(TOURS[CO.key][CO.i],CO.el)});
// which tips belong to the page you just landed on
function coachView(){if(OB||CO||SHEET)return;const v=view;setTimeout(()=>{if(view!==v||OB||CO||SHEET)return;
  if(v==='log'){if($a('#live .lvc'))coach('home_live')}
  else if(v==='res'){const m=S.meals.find(x=>x.id===cur);if(m&&!m.strat)return;coach(m&&isActive(m)?'res_live':'res_past')}
  else if(v==='hist'){coach(MSEG==='foods'?'foods':MSEG==='play'?'play':'hist')}
  else if(v==='set'||v==='rep')coach(v)},750)}
function coachReplay(){S.cfg.seen={};save()}


['pointerdown','keydown','wheel'].forEach(ev=>document.addEventListener(ev,()=>budWake(),{passive:true,capture:true}));
document.addEventListener('scroll',()=>{if(BUD.st==='gone')budWake();else BUD.idle=Date.now()},{passive:true,capture:true});
function buddyInit(){
  const b=document.getElementById('plus');b.innerHTML='<span class="orb3"></span><i class="ob-eyes"><b></b><b></b></i><i class="ring2"></i><svg class="chr" viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="47"/><circle cx="50" cy="50" r="47"/></svg><em class="chl">'+svgw('doc',14)+' Weekly report</em>';
  const tip=document.createElement('div');tip.id='obtip';tip.className='glass';document.getElementById('app').appendChild(tip);tip.addEventListener('click',()=>{const a=BUD.act;if(!a)return;budHide();haptic();a()});
  budShape(idleShape());gooTick();
  budBlink();BUD.last=Date.now()-40000;budSched(3000);
  let lt=0;document.addEventListener('pointermove',e=>{const n=Date.now();if(n-lt<50||MENU)return;lt=n;const o=b.getBoundingClientRect();if(!o.width)return;const dx=e.clientX-(o.left+o.width/2),dy=e.clientY-(o.top+o.height/2),d=Math.hypot(dx,dy)||1;budLook(dx/d,dy/d)},{passive:true});
  document.addEventListener('pointerdown',e=>{if(e.target.closest('#plus'))return;const o=b.getBoundingClientRect(),dx=e.clientX-(o.left+o.width/2),dy=e.clientY-(o.top+o.height/2),d=Math.hypot(dx,dy)||1;budLook(dx/d,dy/d);clearTimeout(BUD.lk);BUD.lk=setTimeout(()=>budLook(0,0),1600)},{passive:true});
  document.addEventListener('scroll',e=>{const p=e.target;if(!p.classList||!p.classList.contains('page'))return;const d=p.scrollTop-(p._by||0);p._by=p.scrollTop;budLook(0,d>0?1:-1);clearTimeout(BUD.sc);BUD.sc=setTimeout(()=>budLook(0,0),500)},{passive:true,capture:true});
}
setInterval(chkIsl,15000);setInterval(()=>{try{brioDue()}catch(e){}},15000);
setInterval(()=>{if(view!=='log'||SHEET||ASK||(SPK&&Date.now()<SPK.until)||BUD.busy||document.visibilityState!=='visible'||Math.random()<.45)return;const a=Math.random()*Math.PI*2;budLook(Math.cos(a)*.8,Math.sin(a)*.5);setTimeout(()=>budLook(0,0),1300)},11000);
// the meal log keeps its mission timeline current while you look at it
setInterval(()=>{if(view!=='res'||SHEET||CTX||document.visibilityState!=='visible')return;const a=document.activeElement;if(a&&a.closest&&a.closest('#stage input,#stage textarea,#stage [contenteditable]'))return;if(document.querySelector('#stage .page.act details[open]')&&!document.querySelector('#stage .page.act details[data-x]'))return;render()},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chkIsl()});
</script>
